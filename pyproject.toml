[project]
name = "MikroTik-scanner-log-analyzer"
version = "0.1.0"
description = "CLI tool that downloads logs from a MikroTik router over SSH and converts them to CSV"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "paramiko>=4.0.0",
    "requests>=2.33.1",
    "scapy>=2.7.0",
]
